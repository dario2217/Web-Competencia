<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa Organigrama</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('blank.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'Caveat', cursive;
        }

        .organigrama-container {
            max-width: 1200px;
            padding: 2rem;
        }

        .rounds {
            display: flex;
            justify-content: center;
            gap: 4rem;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3rem;
        }

        .match {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 1.5rem 0;
        }

        .team {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px dashed #666;
            border-radius: 8px;
            min-width: 160px;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 1.4rem;
            color: #333;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .team:hover {
            background: #fff;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.15);
            transform: rotate(-1deg);
        }
    </style>
</head>
<body>
    <div class="organigrama-container">
        <div class="rounds">
            <!-- Cuartos de final -->
            <div class="round">
                <div class="match">
                    <div class="team">Equipo 1</div>
                    <div class="team">Equipo 2</div>
                </div>
                <div class="match">
                    <div class="team">Equipo 3</div>
                    <div class="team">Equipo 4</div>
                </div>
                <div class="match">
                    <div class="team">Equipo 5</div>
                    <div class="team">Equipo 6</div>
                </div>
                <div class="match">
                    <div class="team">Equipo 7</div>
                    <div class="team">Equipo 8</div>
                </div>
            </div>

            <!-- Semifinales -->
            <div class="round">
                <div class="match">
                    <div class="team">Ganador 1/2</div>
                    <div class="team">Ganador 3/4</div>
                </div>
                <div class="match">
                    <div class="team">Ganador 5/6</div>
                    <div class="team">Ganador 7/8</div>
                </div>
            </div>

            <!-- Final -->
            <div class="round">
                <div class="match">
                    <div class="team">Ganador SF1</div>
                    <div class="team">Ganador SF2</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
